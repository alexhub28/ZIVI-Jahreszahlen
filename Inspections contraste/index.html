<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Inspektionen</title>

  <!-- D3.js -->
  <script src="https://d3js.org/d3.v7.min.js" defer></script>

  <!-- Ton script -->
  <script src="sketch.js" defer></script>

  <style>
    /* Version compacte, dimensionnée pour tenir dans le cadre iframe
       LivingDocs (max 1000×500px) sans scroll vertical. */
    html, body {
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      margin: 6px 14px;
    }

    h2 {
      margin: 0 0 4px 0;
      padding: 0;
      line-height: 1.3;
      font-weight: normal;
      font-size: 14px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    #chart {
      width: 100%;
      overflow-x: auto;
      overflow-y: hidden;
      scrollbar-width: thin;
    }

    #chart::-webkit-scrollbar {
      height: 6px;
    }
  </style>
</head>

<body>

  <h2 id="titleContainer">
    <!-- Inspektionen / Inspections / Ispezioni -->
  </h2>

  <div id="chart"></div>

</body>
</html>
