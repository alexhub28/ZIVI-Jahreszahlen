<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>RD</title>

  <!-- D3.js -->
  <script src="https://d3js.org/d3.v7.min.js"></script>

  <!-- Ton script -->
  <script src="sketch.js"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      margin: clamp(16px, 4vw, 40px);
    }

    h2 {
      margin: 0 0 10px 0;
      padding: 0;
      line-height: 1.4;
      font-weight: normal;
      font-size: clamp(0.95rem, 1.1vw + 0.6rem, 1.4rem);
    }

    /* Beaucoup de barres + libellés : scroll horizontal si l'espace manque. */
    #chart {
      width: 100%;
      overflow-x: auto;
    }

    #legend {
      display: flex;
      flex-wrap: wrap;
      gap: 10px 24px;
      margin-top: 16px;
      max-width: 1100px;
    }

    .legend-item {
      display: flex;
      align-items: flex-start;
      gap: 8px;
      flex: 1 1 260px;
      font-size: clamp(10.5px, 0.3vw + 9.5px, 12.5px);
      color: #222;
      line-height: 1.4;
    }

    .legend-swatch {
      flex: none;
      width: 14px;
      height: 14px;
      border-radius: 2px;
      margin-top: 2px;
    }

    .legend-line {
      flex: none;
      width: 18px;
      height: 0;
      border-top: 3px solid #5A959D;
      margin-top: 8px;
    }

  </style>
</head>

<body>

  <h2 id="titleContainer"></h2>

  <div id="chart"></div>
  <div id="legend"></div>

</body>
</html>
